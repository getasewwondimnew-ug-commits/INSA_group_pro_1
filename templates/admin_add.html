<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Menu Items</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { background:#f5f5f5; }
    .admin-wrap { max-width:1100px; margin:0 auto; padding:40px 20px; }
    .admin-top {
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:2px solid #d4af37; padding-bottom:18px; margin-bottom:32px;
    }
    .admin-top h1 { font-family:"Playfair Display",serif; font-size:2rem; color:#333; }
    .btn-gold {
      background:#d4af37; color:#fff; padding:9px 18px; border-radius:4px;
      text-decoration:none; font-size:.85rem; font-weight:500; border:none; cursor:pointer;
      text-transform:uppercase; letter-spacing:.06em; transition:background .2s;
    }
    .btn-gold:hover { background:#b8941f; }
    .btn-danger {
      background:#e53935; color:#fff; padding:6px 12px; border-radius:4px;
      border:none; cursor:pointer; font-size:.8rem; transition:background .2s;
    }
    .btn-danger:hover { background:#c62828; }
    .btn-edit {
      background:#1976d2; color:#fff; padding:6px 12px; border-radius:4px;
      border:none; cursor:pointer; font-size:.8rem; transition:background .2s;
    }
    .btn-edit:hover { background:#1565c0; }

    /* Add form */
    .card-form {
      background:#fff; border-radius:8px; padding:28px 30px;
      box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:36px;
    }
    .card-form h2 { font-family:"Playfair Display",serif; font-size:1.3rem; margin-bottom:20px; color:#333; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-group.full { grid-column:1/-1; }
    .form-group label { font-size:.82rem; font-weight:500; color:#555; text-transform:uppercase; letter-spacing:.05em; }
    .form-group input, .form-group select, .form-group textarea {
      padding:10px 12px; border:1px solid #ddd; border-radius:4px; font-size:.95rem;
      transition:border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline:none; border-color:#111;
    }
    .form-group textarea { resize:vertical; min-height:70px; }
    .form-actions { margin-top:20px; display:flex; gap:10px; }
    .msg { padding:10px 14px; border-radius:4px; font-size:.88rem; margin-bottom:16px; display:none; }
    .msg.ok  { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9; display:block; }
    .msg.err { background:#fdecea; color:#c62828; border:1px solid #ffcdd2; display:block; }

    /* Menu table */
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    thead { background:#222; color:#fff; }
    th,td { padding:12px 14px; text-align:left; font-size:.88rem; }
    td { border-bottom:1px solid #eee; }
    tbody tr:hover { background:#fafafa; }
    .actions { display:flex; gap:6px; }
    .cat { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.75rem; font-weight:600; background:#eee; color:#555; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="logo">abyssinian meal</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('admin_orders_page') }}">Orders</a></li>
        <li><a href="{{ url_for('admin_menu_page') }}">Menu Items</a></li>
        <li><a href="#" id="logout-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="admin-wrap">
    <div class="admin-top">
      <h1>Menu Management</h1>
      <a href="{{ url_for('admin_orders_page') }}" class="btn-gold">View Orders</a>
    </div>

    <!-- Add / Edit form -->
    <div class="card-form">
      <h2 id="form-title">Add New Menu Item</h2>
      <div id="form-msg" class="msg"></div>
      <form id="menu-form">
        <input type="hidden" id="edit-id" value="" />
        <div class="form-grid">
          <div class="form-group">
            <label for="item_id">Item ID (slug)</label>
            <input type="text" id="item_id" placeholder="e.g. grilled-lamb" required />
          </div>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Item name" required />
          </div>
          <div class="form-group">
            <label for="price">Price (ETB)</label>
            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">— select —</option>
              <option value="starters">Starters</option>
              <option value="main-course">Main Course</option>
              <option value="desserts">Desserts</option>
            </select>
          </div>
          <div class="form-group">
            <label for="img">Image path</label>
            <input type="text" id="img" placeholder="img/imageN.png" required />
          </div>
          <div class="form-group full">
            <label for="desc">Description</label>
            <textarea id="desc" required></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-gold" id="submit-btn">Add Item</button>
          <button type="button" class="btn-gold" id="reset-btn" style="background:#888" onclick="resetForm()">Clear</button>
        </div>
      </form>
    </div>

    <!-- Menu table -->
    <div id="menu-container">
      <p style="text-align:center;color:#999;padding:30px">Loading…</p>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) { window.location.href = '/admin/login'; }

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
      window.location.href = '/admin/login';
    });

    const auth = () => ({
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
    });

    async function loadMenu() {
      const res = await fetch('/api/menu');
      const items = await res.json();
      renderMenu(items);
    }

    function renderMenu(items) {
      if (!items.length) {
        document.getElementById('menu-container').innerHTML = '<p style="text-align:center;color:#999;padding:30px">No menu items.</p>';
        return;
      }
      const rows = items.map(m => `
        <tr>
          <td>${m.id}</td>
          <td>${m.item_id}</td>
          <td><strong>${m.name}</strong></td>
          <td>ETB ${m.price.toFixed(2)}</td>
          <td><span class="cat">${m.category}</span></td>
          <td class="actions">
            <button class="btn-edit" onclick='editItem(${JSON.stringify(m)})'>Edit</button>
            <button class="btn-danger" onclick="deleteItem(${m.id})">Delete</button>
          </td>
        </tr>`).join('');
      document.getElementById('menu-container').innerHTML = `
        <table>
          <thead><tr><th>#</th><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('menu-form').reset();
      document.getElementById('form-title').textContent = 'Add New Menu Item';
      document.getElementById('submit-btn').textContent = 'Add Item';
      document.getElementById('item_id').disabled = false;
      document.getElementById('form-msg').className = 'msg';
    }

    function editItem(m) {
      document.getElementById('edit-id').value = m.id;
      document.getElementById('item_id').value = m.item_id;
      document.getElementById('item_id').disabled = true;
      document.getElementById('name').value = m.name;
      document.getElementById('price').value = m.price;
      document.getElementById('category').value = m.category;
      document.getElementById('img').value = m.img;
      document.getElementById('desc').value = m.desc;
      document.getElementById('form-title').textContent = 'Edit Menu Item';
      document.getElementById('submit-btn').textContent = 'Save Changes';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('menu-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('form-msg');
      msgEl.className = 'msg';
      const editId = document.getElementById('edit-id').value;
      const payload = {
        item_id:  document.getElementById('item_id').value.trim(),
        name:     document.getElementById('name').value.trim(),
        price:    parseFloat(document.getElementById('price').value),
        category: document.getElementById('category').value,
        img:      document.getElementById('img').value.trim(),
        desc:     document.getElementById('desc').value.trim(),
      };
      try {
        let res;
        if (editId) {
          res = await fetch(`/api/admin/menu/${editId}`, {
            method:'PUT', headers:auth(), body:JSON.stringify(payload),
          });
        } else {
          res = await fetch('/api/admin/menu', {
            method:'POST', headers:auth(), body:JSON.stringify(payload),
          });
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        msgEl.textContent = editId ? 'Item updated.' : 'Item added.';
        msgEl.className = 'msg ok';
        resetForm();
        loadMenu();
      } catch (err) {
        msgEl.textContent = err.message;
        msgEl.className = 'msg err';
      }
    });

    async function deleteItem(id) {
      if (!confirm('Delete this menu item?')) return;
      const res = await fetch(`/api/admin/menu/${id}`, {
        method:'DELETE', headers:auth(),
      });
      if (res.ok) loadMenu();
      else alert('Failed to delete item');
    }

    loadMenu();
  </script>
</body>
</html>
